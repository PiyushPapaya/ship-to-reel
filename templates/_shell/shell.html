<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{ID}}</title>
    <!-- GSAP vendored locally by assemble.mjs (no CDN → deterministic, no SRI/network risk). -->
    <script src="./gsap.min.js"></script>
    <style>
      :root {
{{TOKENS}}
        --safe-top: {{SAFE_TOP}}px;
        --safe-bottom: {{SAFE_BOTTOM}}px;
        --safe-right: {{SAFE_RIGHT}}px;
        --caption-size: {{CAPTION_SIZE}}px;
        --caption-font: {{CAPTION_FONT}};
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #000;
        font-family: var(--font);
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      /* Each scene is a full-bleed clip; it stays transparent so its .scene-fill child
         (never the clip itself — HyperFrames owns the clip's own show/hide) can crossfade
         over the previous scene during a seam overlap. */
      .scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .scene-fill {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
        overflow: hidden;
      }
      /* Decorative depth layer behind .stage — real DOM node (not a pseudo-element)
         so GSAP can parallax-drift it; plain color-mix blobs by default, or a
         composited UI screen-capture frame on the hook scene (Phase 3b material). */
      .bg-depth {
        position: absolute;
        inset: -12%;
        background:
          radial-gradient(760px circle at 15% 14%, color-mix(in srgb, var(--accent) 40%, transparent), transparent 58%),
          radial-gradient(680px circle at 88% 86%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 55%),
          radial-gradient(900px circle at 50% 50%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%);
        pointer-events: none;
      }
      .bg-capture {
        background-size: cover;
        background-position: center top;
        filter: saturate(0.75) brightness(0.85);
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, transparent 35%, var(--paper) 82%);
        pointer-events: none;
      }
      /* Real layout element (assemble.mjs decides per-beat whether to emit it),
         not decoration: a giant beat-number bleeding off the corner. It fills the
         lower frame that content-block centering left empty (Phase 4's honest
         composition complaint), and doubles as a wayfinding/distinctiveness cue —
         "you're on beat 2 of 5" — instead of just another gradient. */
      .stage-index {
        position: absolute;
        right: -0.06em;
        bottom: -0.14em;
        font-size: 640px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: color-mix(in srgb, var(--accent) 12%, var(--paper));
        pointer-events: none;
        user-select: none;
      }
      .stage {
        position: absolute;
        top: var(--safe-top);
        right: var(--safe-right);
        bottom: var(--safe-bottom);
        left: 64px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 9%;
        gap: 28px;
      }
      /* result/outro are short "reveal" beats — center them instead of the
         top-anchored rule-of-thirds layout the info-dense beats use, so the big
         metric/sign-off doesn't look pinned to the top of an otherwise-empty frame. */
      [id$="-result"] .stage,
      [id$="-outro"] .stage {
        justify-content: center;
        padding-top: 0;
      }
      .eyebrow {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .eyebrow::before {
        content: "";
        display: block;
        width: 48px;
        height: 4px;
        border-radius: 2px;
        background: var(--accent);
      }
      .headline {
        font-size: 92px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .body {
        font-size: 46px;
        font-weight: 500;
        line-height: 1.25;
        color: #3f3f46;
        margin: 0;
      }
      .card {
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: var(--radius-card, 40px);
        padding: 44px 48px;
        box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.35);
      }
      .metric {
        font-size: 200px;
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.03em;
        color: var(--accent);
        margin: 0;
      }
      .code {
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 40px;
        line-height: 1.5;
        white-space: pre;
      }
      .code .file { color: #52525b; font-size: 32px; display: block; margin-bottom: 20px; }
      .code .del { color: #c62828; display: block; }
      .code .add { color: #1b7a44; display: block; }
      .outro {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        text-align: center;
      }
      .outro .handle { font-size: 56px; font-weight: 800; }
      /* Word-accurate captions (Phase 3c, engine/align-captions.mjs). Position/size
         are channel's call, accent highlight color is brand's — the merge rule from
         PLAN §1's "Grenzfall Captions". Frame-relative and scoped inside each scene's
         .scene-fill, so it shows/hides with that scene's own clip lifecycle. */
      .captions {
        position: absolute;
        left: 64px;
        right: var(--safe-right);
        height: calc(var(--caption-size) * 1.6);
        font-family: var(--caption-font, var(--font));
        font-size: var(--caption-size);
        font-weight: 700;
        line-height: 1.35;
        color: var(--ink);
        text-align: center;
        z-index: 40;
      }
      .captions.pos-top { top: var(--safe-top); }
      .captions.pos-center { top: 50%; transform: translateY(-50%); }
      .captions.pos-lower-third { bottom: calc(var(--safe-bottom) + 40px); }
      .captions.pos-bottom { bottom: var(--safe-bottom); }
      /* Only one .cline (a short rolling chunk of words) is visible at a time —
         they stack in the same box and cross-fade via opacity, driven by
         align-captions.mjs's per-chunk tl.set calls. */
      .captions .cline {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
      .captions .cw { display: inline-block; }
      .captions.boxed .cw { padding: 2px 10px; border-radius: 8px; }
      /* Persistent brand watermark — no class="clip", so it stays visible the whole video. */
      #watermark {
        position: absolute;
        left: 48px;
        bottom: calc(var(--safe-bottom) - 48px);
        font-size: 34px;
        font-weight: 700;
        color: var(--ink);
        opacity: {{WATERMARK_OPACITY}};
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="{{DURATION}}"
      data-fps="30"
    >
{{CLIPS}}
      <div id="watermark">{{WATERMARK_TEXT}}</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
{{TIMELINE_BODY}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
